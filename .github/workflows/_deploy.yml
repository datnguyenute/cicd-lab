# Workflow TÁI SỬ DỤNG: logic deploy viết 1 lần, 3 môi trường gọi lại với input khác nhau.
# Biến cấu hình lấy từ GitHub "Environments" (Settings → Environments → dev/test/prod → Variables).
name: _deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | test | prod"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Gắn job vào GitHub Environment → dùng vars riêng + luật bảo vệ (vd prod cần người duyệt)
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.frontend.outputs.url }}
    permissions:
      contents: read
      id-token: write # bắt buộc để xin OIDC token cho Workload Identity Federation
    env:
      ENV_NAME: ${{ inputs.environment }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}
      VERSION: ${{ github.sha }}
      RUNTIME_SA: ${{ vars.RUNTIME_SA }}
      CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
    steps:
      - uses: actions/checkout@v4

      # Đăng nhập GCP KHÔNG cần JSON key: GitHub OIDC token ↔ GCP Workload Identity Federation
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # ---------------- BACKEND ----------------
      # Image BE không phụ thuộc môi trường → build 1 lần theo commit SHA, các env sau tái sử dụng
      - name: Build & push backend image (build once, deploy many)
        run: |
          IMAGE="$REGISTRY/backend:$VERSION"
          if gcloud artifacts docker images describe "$IMAGE" >/dev/null 2>&1; then
            echo "Image $IMAGE đã tồn tại → tái sử dụng, không build lại"
          else
            docker build -t "$IMAGE" --build-arg APP_VERSION="$VERSION" ./backend
            docker push "$IMAGE"
          fi

      # Migration chạy TRƯỚC khi deploy code mới, bằng Cloud Run Job (chạy 1 lần rồi thoát)
      - name: Run DB migration (Cloud Run Job)
        run: |
          gcloud run jobs deploy "backend-migrate-$ENV_NAME" \
            --image "$REGISTRY/backend:$VERSION" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-secrets "DATABASE_URL=database-url-$ENV_NAME:latest" \
            --command npx --args prisma,migrate,deploy \
            --max-retries 0 \
            --execute-now --wait

      - name: Deploy backend to Cloud Run
        id: backend
        run: |
          gcloud run deploy "backend-$ENV_NAME" \
            --image "$REGISTRY/backend:$VERSION" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --add-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-secrets "DATABASE_URL=database-url-$ENV_NAME:latest" \
            --set-env-vars "APP_ENV=$ENV_NAME,APP_VERSION=$VERSION,FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }},CORS_ORIGINS=${{ vars.FRONTEND_URL }}" \
            --min-instances "${{ vars.MIN_INSTANCES || 0 }}" \
            --max-instances "${{ vars.MAX_INSTANCES || 3 }}" \
            --allow-unauthenticated
          echo "url=$(gcloud run services describe backend-$ENV_NAME --region $REGION --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # ---------------- FRONTEND ----------------
      # Image FE PHẢI build riêng mỗi env vì NEXT_PUBLIC_* bị inline lúc build
      - name: Build & push frontend image
        run: |
          IMAGE="$REGISTRY/frontend:$ENV_NAME-$VERSION"
          docker build -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.backend.outputs.url }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_APP_ENV="$ENV_NAME" \
            --build-arg NEXT_PUBLIC_APP_VERSION="$VERSION" \
            ./frontend
          docker push "$IMAGE"

      - name: Deploy frontend to Cloud Run
        id: frontend
        run: |
          gcloud run deploy "frontend-$ENV_NAME" \
            --image "$REGISTRY/frontend:$ENV_NAME-$VERSION" \
            --region "$REGION" \
            --min-instances "${{ vars.MIN_INSTANCES || 0 }}" \
            --max-instances "${{ vars.MAX_INSTANCES || 3 }}" \
            --allow-unauthenticated
          echo "url=$(gcloud run services describe frontend-$ENV_NAME --region $REGION --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      # ---------------- SMOKE TEST ----------------
      - name: Smoke test (đúng version đã lên chưa?)
        run: |
          curl -fsS "${{ steps.backend.outputs.url }}/health" | tee health.json
          grep -q "\"version\":\"$VERSION\"" health.json
          curl -fsS -o /dev/null "${{ steps.frontend.outputs.url }}"
          echo "### ✅ $ENV_NAME deployed @ \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- FE: ${{ steps.frontend.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- BE: ${{ steps.backend.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
